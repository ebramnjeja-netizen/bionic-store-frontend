<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inventory | Bionic Store</title>
    
<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="admin-layout">


    <!-- =================================
         ADMIN SIDEBAR
    ================================== -->

    <aside
        class="admin-sidebar"
        id="adminSidebar"
    >

        <div class="sidebar-logo">

            <div class="sidebar-logo-icon">
                🧾
            </div>

            <div>

                <strong>
                    BIONIC STORE
                </strong>

                <span>
                    ADMIN PANEL
                </span>

            </div>

        </div>


        <nav class="sidebar-nav">


            <div class="sidebar-section-title">
                MAIN
            </div>


            <a
                href="dashboard.html"
                class="sidebar-link"
            >
                <span>🏠</span>
                <span>Dashboard</span>
            </a>


            <a
                href="pos.html"
                class="sidebar-link"
            >
                <span>🛒</span>
                <span>POS</span>
            </a>


            <div class="sidebar-section-title">
                MANAGEMENT
            </div>


            <a
                href="inventory.html"
                class="sidebar-link active"
            >
                <span>📦</span>
                <span>Inventory</span>
            </a>


            <a
                href="orders.html"
                class="sidebar-link"
            >
                <span>🧾</span>
                <span>Sales</span>
            </a>


            <a
                href="customers.html"
                class="sidebar-link"
            >
                <span>👥</span>
                <span>Customers</span>
            </a>


            <a
                href="repairs.html"
                class="sidebar-link"
            >
                <span>🔧</span>
                <span>Repairs</span>
            </a>


            <div class="sidebar-section-title">
                REPORTING
            </div>


            <a
                href="reports.html"
                class="sidebar-link"
            >
                <span>📊</span>
                <span>Reports</span>
            </a>


            <a
                href="invoices.html"
                class="sidebar-link"
            >
                <span>💳</span>
                <span>Invoices</span>
            </a>


            <a
                href="stock-history.html"
                class="sidebar-link"
            >
                <span>📜</span>
                <span>Stock History</span>
            </a>


        </nav>


        <div class="sidebar-bottom">

            <a
                href="#"
                class="sidebar-link"
                onclick="openAdminSettings(event)"
            >
                <span>⚙️</span>
                <span>Settings</span>
            </a>


            <button
                type="button"
                class="sidebar-link sidebar-logout"
                onclick="adminLogout()"
            >
                <span>🚪</span>
                <span>Logout</span>
            </button>

        </div>

    </aside>



    <!-- =================================
         MAIN INVENTORY AREA
    ================================== -->

    <main class="admin-main">


        <!-- MOBILE SIDEBAR BUTTON -->

        <button
            type="button"
            class="sidebar-toggle"
            id="sidebarToggle"
            onclick="toggleSidebar()"
        >
            ☰
        </button>



        <!-- =================================
             INVENTORY
        ================================== -->

        <section class="inventory-page">


            <h1>
                Inventory Management
            </h1>


            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >


            <table id="inventoryTable">

                <thead>

                    <tr>

                        <th>
                            Image
                        </th>

                        <th>
                            Product
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Stock
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Update
                        </th>

                    </tr>

                </thead>


                <tbody>

                </tbody>

            </table>


        </section>


    </main>


</div>



<!-- =================================
     INVENTORY JAVASCRIPT
================================== -->

<script src="../js/inventory.js"></script>



<!-- =================================
     SIDEBAR FUNCTIONS
================================== -->

<script>

function toggleSidebar() {

    const sidebar =
        document.getElementById(
            "adminSidebar"
        );

    if (!sidebar) {
        return;
    }

    sidebar.classList.toggle(
        "open"
    );

}


function openAdminSettings(event) {

    event.preventDefault();

    alert(
        "⚙️ Admin Settings will be available in the next upgrade."
    );

}


function adminLogout() {

    const confirmed =
        confirm(
            "Are you sure you want to logout?"
        );

    if (!confirmed) {
        return;
    }


    localStorage.removeItem(
        "token"
    );

    localStorage.removeItem(
        "user"
    );


    window.location.href =
        "../index.html";

}

</script>


</body>

</html>
