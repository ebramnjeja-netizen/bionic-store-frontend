<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Bionic Store</title>

 <link rel="stylesheet" href="../css/style.css">
 
</head>
<body>

<div class="cart-page">

    <h1>🛒 Shopping Cart</h1>

    <div id="cartPageItems"></div>

    <div class="cart-summary">

        <h2>Total: <span id="cartPageTotal">TZS 0</span></h2>

        <button onclick="clearCart()" class="clear-btn">
             🧹 Clear Cart
                </button>
                
            <a href="../index.html" class="continue-btn">
                ← Continue Shopping
            </a>


            <button onclick="goToCheckout()" class="checkout-btn">
                   Proceed to Checkout →
                </button>

        </div>

    </div>

</div>



<script>
document.addEventListener("DOMContentLoaded", () => {
    renderCartPage();
});

function goToCheckout() {
    window.location.href = "checkout.html";
}

</script>

<script src="../js/cart.js"></script>

</body>
</html>
