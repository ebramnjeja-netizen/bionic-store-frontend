<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Invoice History | Bionic Store</title>

<link rel="stylesheet" href="../css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
        }


        .history-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }


        .history-header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }


        .history-header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }


        .history-header p {
            margin: 0;
            color: #666;
        }


        .history-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }


        .history-actions input {
            flex: 1;
            min-width: 250px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }


        .history-actions button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #0d6efd;
            color: white;
            font-size: 15px;
        }


        .history-actions button:hover {
            opacity: 0.9;
        }


        .back-button {
            background: #6c757d !important;
        }


        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            overflow-x: auto;
        }


        #invoiceHistoryTable {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }


        #invoiceHistoryTable th {
            background: #0d6efd;
            color: white;
            padding: 14px;
            text-align: left;
        }


        #invoiceHistoryTable td {
            padding: 13px;
            border-bottom: 1px solid #eee;
        }


        #invoiceHistoryTable tr:hover {
            background: #f8f9fa;
        }


        .invoice-number {
            font-weight: bold;
            color: #0d6efd;
        }


        .amount {
            font-weight: bold;
        }


        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #d4edda;
            color: #155724;
            font-size: 13px;
            font-weight: bold;
        }


        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }


        .action-buttons button {
            border: none;
            border-radius: 6px;
            padding: 7px 10px;
            cursor: pointer;
            color: white;
        }


        .view-button {
            background: #0d6efd;
        }


        .print-button {
            background: #198754;
        }


        .delete-button {
            background: #dc3545;
        }


        .empty-message {
            text-align: center;
            padding: 40px;
            color: #777;
            font-size: 17px;
        }


        .loading-message {
            text-align: center;
            padding: 40px;
            color: #555;
        }


        .error-message {
            text-align: center;
            padding: 40px;
            color: #dc3545;
        }


        @media (max-width: 700px) {

            .history-page {
                padding: 15px;
            }


            .history-header h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<div class="history-page">


    <!-- =================================
         HEADER
    ================================== -->

    <div class="history-header">

        <h1>
            🧾 Bionic Store Invoice History
        </h1>

        <p>
            View and manage completed repair invoices.
        </p>


        <div class="history-actions">

            <input
                type="text"
                id="invoiceSearch"
                placeholder="🔍 Search invoice, customer, phone, device..."
            >


            <button
                type="button"
                onclick="loadInvoiceHistory()"
            >
                🔄 Refresh
            </button>


            <button
                type="button"
                class="back-button"
                onclick="goBack()"
            >
                ← Back
            </button>

        </div>

    </div>





    <div class="table-container">

        <table id="invoiceHistoryTable">

            <thead>

                <tr>

                    <th>
                        Invoice
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Customer
                    </th>

                    <th>
                        Phone
                    </th>

                    <th>
                        Device
                    </th>

                    <th>
                        Problem
                    </th>

                    <th>
                        Amount
                    </th>

                    <th>
                        Payment
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="invoiceHistoryBody">

                <tr>

                    <td
                        colspan="10"
                        class="loading-message"
                    >
                        Loading invoice history...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>



<script>



const API_BASE_URL = "https://bionic-store-backend.onrender.com/api";


let invoiceHistory = [];




async function loadInvoiceHistory() {

    console.log(
        "Loading repair invoice history..."
    );


    const tableBody =
        document.getElementById(
            "invoiceHistoryBody"
        );


    if (!tableBody) {

        console.error(
            "Invoice history table not found."
        );

        return;
    }


    tableBody.innerHTML = `

        <tr>

            <td
                colspan="10"
                class="loading-message"
            >
                Loading invoice history...
            </td>

        </tr>

    `;


    try {

        const response =
            await fetch(
                API_BASE_URL +
                "/invoice-history"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to load invoice history."
            );

        }


        invoiceHistory =
            Array.isArray(data)
                ? data
                : [];


        console.log(
            "Invoice history loaded:",
            invoiceHistory
        );


        renderInvoiceHistory(
            invoiceHistory
        );


    } catch (error) {

        console.error(
            "Invoice history error:",
            error
        );


        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="error-message"
                >

                    ❌ Failed to load invoice history.

                    <br><br>

                    ${error.message}

                </td>

            </tr>

        `;

    }

}



/* =========================================
   RENDER
========================================= */

function renderInvoiceHistory(
    records
) {

    const tableBody =
        document.getElementById(
            "invoiceHistoryBody"
        );


    if (!tableBody) {
        return;
    }


    tableBody.innerHTML = "";


    if (
        !records ||
        records.length === 0
    ) {

        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="empty-message"
                >

                    🧾 No repair invoices found.

                </td>

            </tr>

        `;

        return;
    }


    records.forEach(
        function(invoice) {


            const row =
                document.createElement(
                    "tr"
                );


            const invoiceNumber =
                invoice.invoiceNumber ||
                "-";


            const date =
                invoice.createdAt
                    ? new Date(
                        invoice.createdAt
                    ).toLocaleString()
                    : "-";


            const customerName =
                invoice.customerName ||
                "Walk-in Customer";


            const customerPhone =
                invoice.customerPhone ||
                "-";


            const device =
                [
                    invoice.deviceType,
                    invoice.brand,
                    invoice.model
                ]
                .filter(Boolean)
                .join(" ");


            const deviceName =
                device ||
                "Device";


            const problem =
                invoice.problem ||
                "Repair Service";


            const amount =
                Number(
                    invoice.estimatedCost
                ) || 0;


            const payment =
                invoice.paymentMethod ||
                "Cash";


            const status =
                invoice.status ||
                "Completed";


            row.innerHTML = `

                <td>

                    <span class="invoice-number">

                        ${escapeHTML(
                            invoiceNumber
                        )}

                    </span>

                </td>


                <td>

                    ${escapeHTML(
                        date
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        customerName
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        customerPhone
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        deviceName
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        problem
                    )}

                </td>


                <td>

                    <span class="amount">

                        $${amount.toFixed(2)}

                    </span>

                </td>


                <td>

                    ${escapeHTML(
                        payment
                    )}

                </td>


                <td>

                    <span class="status">

                        ${escapeHTML(
                            status
                        )}

                    </span>

                </td>


                <td>

                    <div class="action-buttons">

                        <button
                            class="view-button"
                            onclick="viewInvoice('${invoice._id}')"
                        >
                            View
                        </button>


                        <button
                            class="print-button"
                            onclick="printInvoice('${invoice._id}')"
                        >
                            Print
                        </button>


                        <button
                            class="delete-button"
                            onclick="deleteInvoice('${invoice._id}')"
                        >
                            Delete
                        </button>

                    </div>

                </td>

            `;


            tableBody.appendChild(
                row
            );

        }
    );

}



/* =========================================
   SEARCH
========================================= */

function searchInvoices() {

    const input =
        document.getElementById(
            "invoiceSearch"
        );


    if (!input) {
        return;
    }


    const keyword =
        input.value
            .toLowerCase()
            .trim();


    if (!keyword) {

        renderInvoiceHistory(
            invoiceHistory
        );

        return;
    }


    const filtered =
        invoiceHistory.filter(
            function(invoice) {


                const invoiceNumber =
                    String(
                        invoice.invoiceNumber ||
                        ""
                    ).toLowerCase();


                const customer =
                    String(
                        invoice.customerName ||
                        ""
                    ).toLowerCase();


                const phone =
                    String(
                        invoice.customerPhone ||
                        ""
                    ).toLowerCase();


                const device =
                    String(
                        invoice.deviceType ||
                        ""
                    ).toLowerCase();


                const brand =
                    String(
                        invoice.brand ||
                        ""
                    ).toLowerCase();


                const model =
                    String(
                        invoice.model ||
                        ""
                    ).toLowerCase();


                const problem =
                    String(
                        invoice.problem ||
                        ""
                    ).toLowerCase();


                return (

                    invoiceNumber.includes(
                        keyword
                    ) ||

                    customer.includes(
                        keyword
                    ) ||

                    phone.includes(
                        keyword
                    ) ||

                    device.includes(
                        keyword
                    ) ||

                    brand.includes(
                        keyword
                    ) ||

                    model.includes(
                        keyword
                    ) ||

                    problem.includes(
                        keyword
                    )

                );

            }
        );


    renderInvoiceHistory(
        filtered
    );

}





async function viewInvoice(
    id
) {

    try {

        const response =
            await fetch(
                API_BASE_URL +
                "/invoice-history/" +
                id
            );


        const invoice =
            await response.json();


        if (!response.ok) {

            throw new Error(
                invoice.message ||
                "Invoice not found."
            );

        }


        localStorage.setItem(
            "repairInvoice",
            JSON.stringify({

                invoiceNumber:
                    invoice.invoiceNumber,

                customer: {

                    name:
                        invoice.customerName,

                    phone:
                        invoice.customerPhone

                },

                deviceType:
                    invoice.deviceType,

                brand:
                    invoice.brand,

                model:
                    invoice.model,

                problem:
                    invoice.problem,

                estimatedCost:
                    invoice.estimatedCost,

                paymentMethod:
                    invoice.paymentMethod,

                amountReceived:
                    invoice.amountReceived,

                changeAmount:
                    invoice.changeAmount

            })
        );


        window.location.href =
            "invoices.html";


    } catch (error) {

        console.error(
            error
        );


        alert(
            "❌ " +
            error.message
        );

    }

}





async function printInvoice(
    id
) {

    try {

        const response =
            await fetch(
                API_BASE_URL +
                "/invoice-history/" +
                id
            );


        const invoice =
            await response.json();


        if (!response.ok) {

            throw new Error(
                invoice.message ||
                "Invoice not found."
            );

        }


        localStorage.setItem(
            "repairInvoice",
            JSON.stringify({

                invoiceNumber:
                    invoice.invoiceNumber,

                customer: {

                    name:
                        invoice.customerName,

                    phone:
                        invoice.customerPhone

                },

                deviceType:
                    invoice.deviceType,

                brand:
                    invoice.brand,

                model:
                    invoice.model,

                problem:
                    invoice.problem,

                estimatedCost:
                    invoice.estimatedCost,

                paymentMethod:
                    invoice.paymentMethod,

                amountReceived:
                    invoice.amountReceived,

                changeAmount:
                    invoice.changeAmount

            })
        );


        const invoiceWindow =
            window.open(
                "invoices.html",
                "_blank"
            );


        if (!invoiceWindow) {

            alert(
                "Please allow pop-ups for Bionic Store."
            );

        }


    } catch (error) {

        console.error(
            error
        );


        alert(
            "❌ " +
            error.message
        );

    }

}



/* =========================================
   DELETE INVOICE
========================================= */

async function deleteInvoice(
    id
) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this invoice?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                API_BASE_URL +
                "/invoice-history/" +
                id,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to delete invoice."
            );

        }


        alert(
            "✅ Invoice deleted successfully."
        );


        loadInvoiceHistory();


    } catch (error) {

        console.error(
            "Delete invoice error:",
            error
        );


        alert(
            "❌ " +
            error.message
        );

    }

}





function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}





function goBack() {

    window.history.back();

}





document.addEventListener(
    "DOMContentLoaded",
    function () {

        console.log(
            "Invoice History page ready"
        );


        const search =
            document.getElementById(
                "invoiceSearch"
            );


        if (search) {

            search.addEventListener(
                "input",
                searchInvoices
            );

        }


        loadInvoiceHistory();

    }
);

</script>

<script src="../js/invoice-history.js"></script>
</body>

</html>
