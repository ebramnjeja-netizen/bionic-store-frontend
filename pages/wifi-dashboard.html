<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Bionic Store | Wi-Fi Sales Dashboard</title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <style>

        .wifi-dashboard {
            max-width: 1300px;
            margin: 30px auto;
            padding: 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .dashboard-header h1 {
            margin: 0;
        }

        .dashboard-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dashboard-actions button {
            border: none;
            padding: 11px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-btn {
            background: #007bff;
            color: white;
        }

        .history-btn {
            background: #555;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            margin: 0 0 10px;
        }

        .stat-value {
            font-size: 30px;
            font-weight: bold;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .dashboard-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .dashboard-card h2 {
            margin-top: 0;
        }

        .report-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .report-row:last-child {
            border-bottom: none;
        }

        .dashboard-message {
            margin: 15px 0;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="wifi-dashboard">


    <div class="dashboard-header">

        <h1>
            📶 Wi-Fi Sales Dashboard
        </h1>


        <div class="dashboard-actions">

            <button
                type="button"
                class="history-btn"
                onclick="window.location.href='wifi-voucher-sales.html'">

                📋 Sales History

            </button>


            <button
                type="button"
                class="refresh-btn"
                onclick="loadWifiDashboard()">

                🔄 Refresh

            </button>

        </div>

    </div>


    <div
        id="dashboardMessage"
        class="dashboard-message">
    </div>


    <!-- MAIN STATS -->

    <div class="stats-grid">


        <div class="stat-card">

            <h3>
                🎟️ Total Vouchers
            </h3>

            <div
                id="totalVouchers"
                class="stat-value">

                0

            </div>

        </div>


        <div class="stat-card">

            <h3>
                💰 Total Revenue
            </h3>

            <div
                id="totalRevenue"
                class="stat-value">

                TZS 0

            </div>

        </div>


        <div class="stat-card">

            <h3>
                📅 Today's Sales
            </h3>

            <div
                id="todaySales"
                class="stat-value">

                0

            </div>

        </div>


        <div class="stat-card">

            <h3>
                📆 This Month
            </h3>

            <div
                id="monthSales"
                class="stat-value">

                0

            </div>

        </div>


        <div class="stat-card">

            <h3>
                🟢 Available
            </h3>

            <div
                id="availableVouchers"
                class="stat-value">

                0

            </div>

        </div>


        <div class="stat-card">

            <h3>
                🟠 Sold
            </h3>

            <div
                id="soldVouchers"
                class="stat-value">

                0

            </div>

        </div>

    </div>


    <!-- REPORTS -->

    <div class="dashboard-grid">


        <div class="dashboard-card">

            <h2>
                📦 Sales by Package
            </h2>

            <div
                id="packageSales">
            </div>

        </div>


        <div class="dashboard-card">

            <h2>
                💳 Sales by Payment Method
            </h2>

            <div
                id="paymentSales">
            </div>

        </div>


    </div>


</div>


<script
    src="../js/wifi-dashboard.js">
</script>


</body>

</html>
