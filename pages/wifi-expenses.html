<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Bionic Store | Wi-Fi Expenses</title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <style>

        .expense-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }

        .expense-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .expense-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .expense-form {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .expense-form input,
        .expense-form select,
        .expense-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .expense-form textarea {
            min-height: 90px;
            resize: vertical;
        }

        .expense-form button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #007bff;
            color: white;
            font-weight: bold;
        }

        .expense-summary {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .expense-stat {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .expense-stat h3 {
            margin-top: 0;
        }

        .expense-stat strong {
            font-size: 24px;
        }

        .expense-table-wrapper {
            overflow-x: auto;
        }

        .expense-table {
            width: 100%;
            border-collapse: collapse;
        }

        .expense-table th,
        .expense-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .expense-message {
            margin: 15px 0;
            font-weight: bold;
        }

        .delete-expense {
            border: none;
            background: #dc2626;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="expense-container">

    <div class="expense-header">

        <h1>💸 Wi-Fi Expenses</h1>

        <button
            type="button"
            onclick="loadExpenses()">

            🔄 Refresh

        </button>

    </div>


    <!-- SUMMARY -->

    <div class="expense-summary">

        <div class="expense-stat">

            <h3>Total Expenses</h3>

            <strong id="totalExpenses">
                TZS 0
            </strong>

        </div>


        <div class="expense-stat">

            <h3>Number of Expenses</h3>

            <strong id="expenseCount">
                0
            </strong>

        </div>

    </div>


    <!-- ADD EXPENSE -->

    <div class="expense-card">

        <h2>➕ Add Expense</h2>

        <form
            id="expenseForm"
            class="expense-form">

            <input
                type="text"
                id="expenseDescription"
                placeholder="Expense Description"
                required>


            <select id="expenseCategory">

                <option value="Internet">
                    Internet
                </option>

                <option value="Electricity">
                    Electricity
                </option>

                <option value="Maintenance">
                    Maintenance
                </option>

                <option value="Equipment">
                    Equipment
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <input
                type="number"
                id="expenseAmount"
                placeholder="Amount (TZS)"
                min="0"
                required>


            <input
                type="date"
                id="expenseDate">


            <textarea
                id="expenseNotes"
                placeholder="Notes (optional)">
            </textarea>


            <button type="submit">
                💾 Save Expense
            </button>

        </form>

    </div>


    <div
        id="expenseMessage"
        class="expense-message">
    </div>


    <!-- EXPENSE LIST -->

    <div class="expense-card">

        <h2>📋 Expense History</h2>

        <div class="expense-table-wrapper">

            <table class="expense-table">

                <thead>

                    <tr>

                        <th>
                            Date
                        </th>

                        <th>
                            Description
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Notes
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody id="expenseTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script src="../js/wifi-expenses.js"></script>

</body>

</html>
