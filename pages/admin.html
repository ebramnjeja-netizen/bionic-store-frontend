<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bionic Store Admin</title>

<link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="dashboard">

    <h1>🛍️ Bionic Store Admin Dashboard</h1>

    <div class="stats">

        <div class="card">
            <h2 id="totalProducts">0</h2>
            <p>📦 Products</p>
        </div>

        <div class="card">
            <h2 id="totalOrders">0</h2>
            <p>🛒 Orders</p>
        </div>

        <div class="card">
            <h2 id="totalUsers">0</h2>
            <p>👥 Users</p>
        </div>

        <div class="card">
            <h2 id="totalSales">TZS 0</h2>
            <p>💰 Sales</p>
        </div>

    </div>

    <div class="actions">

        <a href="add-product.html">➕ Add Product</a>

        <a href="manage-products.html">📦 Products</a>

        <a href="manage-orders.html">🛒 Orders</a>

        <a href="manage-users.html">👥 Users</a>

        <a href="pages/business-dashboard.html">
             📊 Business Dashboard</a>

    </div>

    <div class="section">

        <h2>📊 Sales Analytics</h2>

        <canvas id="salesChart"></canvas>

    </div>

    <div class="section">

        <h2>🛒 Recent Orders</h2>

        <table id="recentOrders">

        </table>

    </div>


    <div class="section">

    <h2>🚨 Low Stock Products</h2>

    <table id="lowStockTable">

    </table>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="../js/admin.js"></script>

</body>
</html>
