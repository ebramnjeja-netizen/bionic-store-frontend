<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Bionic Store | Wi-Fi Voucher Sales History</title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <style>

        .sales-history-container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 20px;
        }

        .sales-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .sales-header h1 {
            margin: 0;
        }

        .sales-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .sales-actions button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-btn {
            background: #007bff;
            color: white;
        }

        .back-btn {
            background: #555;
            color: white;
        }

        .sales-summary {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .summary-card h3 {
            margin-top: 0;
        }

        .summary-value {
            font-size: 28px;
            font-weight: bold;
        }

        .sales-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .sales-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .sales-controls input,
        .sales-controls select {
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .sales-table-wrapper {
            overflow-x: auto;
        }

        .sales-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        .sales-table th,
        .sales-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .sales-table th {
            background: #f5f5f5;
        }

        .voucher-code {
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status-sold {
            color: #d97706;
            font-weight: bold;
        }

        .payment-method {
            font-weight: bold;
        }

        .sales-message {
            margin: 15px 0;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="sales-history-container">


    <div class="sales-header">

        <h1>
            📋 Wi-Fi Voucher Sales History
        </h1>

        <div class="sales-actions">

            <button
                type="button"
                class="back-btn"
                onclick="window.location.href='wifi-vouchers.html'">

                ← Voucher Inventory

            </button>

            <button
                type="button"
                class="refresh-btn"
                onclick="loadVoucherSalesHistory()">

                🔄 Refresh

            </button>

        </div>

    </div>


    <!-- SUMMARY -->

    <div class="sales-summary">

        <div class="summary-card">

            <h3>
                Total Sales
            </h3>

            <div
                id="totalVoucherSales"
                class="summary-value">

                0

            </div>

        </div>


        <div class="summary-card">

            <h3>
                Revenue
            </h3>

            <div
                id="totalVoucherRevenue"
                class="summary-value">

                TZS 0

            </div>

        </div>


        <div class="summary-card">

            <h3>
                Cash Received
            </h3>

            <div
                id="totalVoucherReceived"
                class="summary-value">

                TZS 0

            </div>

        </div>


        <div class="summary-card">

            <h3>
                Change Given
            </h3>

            <div
                id="totalVoucherChange"
                class="summary-value">

                TZS 0

            </div>

        </div>

    </div>


    <!-- SALES TABLE -->

    <div class="sales-card">


        <div class="sales-controls">

            <input
                type="text"
                id="voucherSalesSearch"
                placeholder="Search code, customer, phone...">

            <select
                id="voucherPaymentFilter">

                <option value="">
                    All Payment Methods
                </option>

                <option value="Cash">
                    Cash
                </option>

                <option value="Mobile Money">
                    Mobile Money
                </option>

                <option value="Card">
                    Card
                </option>

                <option value="Bank">
                    Bank
                </option>

            </select>

        </div>


        <div
            id="voucherSalesMessage"
            class="sales-message">
        </div>


        <div class="sales-table-wrapper">

            <table class="sales-table">

                <thead>

                    <tr>

                        <th>
                            Voucher
                        </th>

                        <th>
                            Package
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Price
                        </th>

                        <th>
                            Received
                        </th>

                        <th>
                            Change
                        </th>

                        <th>
                            Payment
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="voucherSalesTableBody">
                </tbody>

            </table>

        </div>

    </div>


</div>


<script
    src="../js/wifi-voucher-sales.js">
</script>


</body>

</html>
